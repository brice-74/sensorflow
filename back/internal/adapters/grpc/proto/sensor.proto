syntax = "proto3";

option go_package = "github.com/brice-74/sensorflow/internal/adapters/grpc/proto";

package sensor;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

service SensorService {
  rpc StreamCustomMeasurements(stream CustomMeasurementsRequest) returns (stream IngestAck);
  rpc UnaryCustomMeasurements(CustomMeasurementsRequest) returns (IngestAck);

  rpc StreamAccelGyroMeasurements(stream AccelGyroMeasurementsRequest) returns (stream IngestAck);
  rpc UnaryAccelGyroMeasurements(AccelGyroMeasurementsRequest) returns (IngestAck);
}

enum AckMode {
  ACK_MODE_UNSPECIFIED = 0;
  ACK_MODE_FULL = 1; // stats + erreurs (par défaut)
  ACK_MODE_STATS_ONLY = 2; // accepted/rejected uniquement
  ACK_MODE_NONE = 3; // fire-and-forget
}

message IngestOptions {
  AckMode ack_mode = 1;
  optional uint32 max_rejected_details = 2; 
  optional uint32 ack_every_n = 3; 
  optional uint32 ack_max_interval_ms = 4;
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_STATUS_OK = 1;
  INGEST_STATUS_PARTIAL = 2;
  INGEST_STATUS_THROTTLED = 3;
  INGEST_STATUS_REJECTED = 4;
}

message IngestAck {
  uint64 accepted = 1;
  uint64 rejected = 2;
  IngestStatus status = 3;
  optional string message = 4;
  repeated RejectedDetail rejected_details = 5;
}

enum RejectionCode {
  UNKNOWN = 0;
  INVALID_SENSOR_ID = 1;
  UNKNOWN_SENSOR_OR_INVALID_PLAN = 2;
}

message RejectedDetail {
  string sensor_id = 1;
  RejectionCode code = 2;
  string reason = 3; 
  uint64 count = 4;  
}

message CustomMeasurementsRequest {
  repeated CustomMeasurementsForSensor sensors = 1;
  optional IngestOptions options = 2;
}

message CustomMeasurementsForSensor {
  string sensor_id = 1;
  string profile_id = 2;
  repeated CustomMeasurement measurements = 3;
}

message CustomMeasurement {
  google.protobuf.Timestamp measured_at = 1;
  map<string, google.protobuf.Any> values = 2;
}

enum TemperatureUnit {
  CELSIUS = 0; // °C
  FAHRENHEIT = 1; // °F
  KELVIN = 2; // K
}

enum AccelUnit {
  M_S2 = 0; // m/s²
  G = 1; // g
}

enum GyroUnit {
  DEG_S = 0; // °/s
  RAD_S = 1; // rad/s
}

message IngestAccelGyroOptions {
  optional IngestOptions ingest_options = 1;
  optional AccelUnit accel_unit = 2;
  optional GyroUnit gyro_unit = 3;
  optional TemperatureUnit temperature_unit = 4;
}

message AccelGyroMeasurementsRequest {
  repeated AccelGyroMeasurementsForSensor sensors = 1;
  optional IngestAccelGyroOptions options = 2;
}

message AccelGyroMeasurementsForSensor {
  string sensor_id = 1;
  repeated AccelGyroMeasurement measurements = 2;
}

message AccelGyroMeasurement {
  google.protobuf.Timestamp measured_at = 1;
  double accel_x = 2;
  double accel_y = 3;
  double accel_z = 4;
  double gyro_x = 5;
  double gyro_y = 6;
  double gyro_z = 7;
  optional double temperature = 8;
  optional double vibration_rms = 9;
  optional double vibration_peak = 10;
}
